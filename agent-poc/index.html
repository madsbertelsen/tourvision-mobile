<!doctype html>
<html>
  <head>
    <title>Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Mapbox GL CSS and JS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>

    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #1f2937;
        background-color: #ffffff;
      }

      /* Custom header for editor page */
      #editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        flex-shrink: 0;
      }

      /* Hide header when hideHeader param is present */
      body.hide-header #editor-header {
        display: none;
      }

      /* Adjust root height when header is hidden */
      body.hide-header #root {
        height: 100vh;
      }

      #editor-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      #doc-id {
        font-size: 13px;
        color: #6b7280;
        font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      }

      #new-doc-btn {
        padding: 8px 16px;
        background-color: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      #new-doc-btn:hover {
        background-color: #2563eb;
      }

      #new-doc-btn:active {
        background-color: #1d4ed8;
      }

      /* Make root fill remaining screen height and prevent body scroll */
      #root {
        height: calc(100vh - 49px); /* Subtract header height */
        overflow: hidden;
        position: relative;
      }

      /* Hide all UI elements from index.js except the editor */
      #root > div > div:not(#editor) {
        display: none !important;
      }

      /* Make editor fill the screen and scroll internally */
      #editor {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow-y: auto;
        padding: 16px;
        border: none !important;
      }

      /* Version indicator - visible even when header is hidden */
      #version-indicator {
        position: fixed;
        top: 5px;
        right: 5px;
        background: red;
        color: white;
        padding: 4px 8px;
        font-size: 10px;
        font-weight: bold;
        z-index: 9999;
        border-radius: 3px;
      }

      /* ProseMirror editor styling */
      .ProseMirror {
        outline: none;
        min-height: 100%;
        font-size: 16px;
        line-height: 1.75;
      }

      .ProseMirror p {
        margin: 0 0 16px 0;
      }

      .ProseMirror p:last-child {
        margin-bottom: 0;
      }

      .ProseMirror h1,
      .ProseMirror h2,
      .ProseMirror h3 {
        font-weight: 600;
        margin: 24px 0 12px 0;
        line-height: 1.3;
      }

      .ProseMirror h1:first-child,
      .ProseMirror h2:first-child,
      .ProseMirror h3:first-child {
        margin-top: 0;
      }

      .ProseMirror h1 { font-size: 2em; }
      .ProseMirror h2 { font-size: 1.5em; }
      .ProseMirror h3 { font-size: 1.25em; }

      /* ProseMirror's own selection styling */
      .ProseMirror-selectednode {
        outline: 3px solid #3b82f6;
        outline-offset: 2px;
      }

      /* Fullscreen Map Overlay */
      #fullscreen-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10000;
        display: none;
        opacity: 0;
        transition: opacity 300ms ease-in-out;
      }

      #fullscreen-overlay.visible {
        display: block;
      }

      #fullscreen-overlay.fade-in {
        opacity: 1;
      }

      .backdrop {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.55);
        z-index: 10001;
      }

      #fullscreen-map-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10002;
      }

      #fullscreen-map {
        width: 100vw;
        height: 100vh;
        opacity: 0.7;
      }

      #fullscreen-map .mapboxgl-canvas-container {
        opacity: 0.7;
      }

      .close-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        border-radius: 20px;
        background-color: rgba(255, 255, 255, 0.95);
        border: none;
        font-size: 24px;
        cursor: pointer;
        z-index: 10003;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        font-weight: 300;
        transition: transform 0.2s;
      }

      .close-btn:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <script>
      // Check for hideHeader parameter immediately (before body renders)
      const params = new URLSearchParams(window.location.search);
      if (params.get('hideHeader') === 'true') {
        document.body.classList.add('hide-header');
      }
    </script>
    <div id="editor-header">
      <div id="editor-info">
        <span id="doc-id">Loading...</span>
        <span style="color: red; font-weight: bold; margin-left: 20px;">UPDATED VERSION</span>
      </div>
      <button id="new-doc-btn">+ New Document</button>
    </div>
    <div id="root"></div>

    <!-- Fullscreen Map Overlay (hidden by default) -->
    <div id="fullscreen-overlay">
      <div class="backdrop"></div>
      <div id="fullscreen-map-container">
        <div id="fullscreen-map"></div>
      </div>
      <button class="close-btn">✕</button>
    </div>

    <script src="/src/client/index.js" type="module"></script>
  </body>
</html>
