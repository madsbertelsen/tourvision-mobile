<!doctype html>
<html>
  <head>
    <title>Yjs editor</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background-color: #f9fafb;
      }

      /* ProseMirror editor styling */
      .ProseMirror {
        outline: none;
        padding: 16px;
        background: white;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        min-height: 200px;
        font-size: 16px;
        line-height: 1.75;
      }

      .ProseMirror p {
        margin: 0 0 16px 0;
      }

      .ProseMirror h1,
      .ProseMirror h2,
      .ProseMirror h3 {
        font-weight: 600;
        margin: 24px 0 12px 0;
        line-height: 1.3;
      }

      .ProseMirror h1 { font-size: 2em; }
      .ProseMirror h2 { font-size: 1.5em; }
      .ProseMirror h3 { font-size: 1.25em; }

      /* Geo-mark styling */
      .geo-mark {
        background-color: rgba(59, 130, 246, 0.15);
        color: inherit;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .geo-mark:hover {
        background-color: rgba(59, 130, 246, 0.25);
      }

      /* Headings */
      h1, h2, h3 {
        font-weight: 600;
        color: #111827;
      }

      /* Buttons */
      button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/client/index.js" type="module"></script>
  </body>
</html>
