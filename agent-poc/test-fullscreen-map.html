<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Map Transition Test</title>

  <!-- Mapbox GL CSS -->
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: white;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .content {
      padding: 40px;
    }

    h1 {
      margin: 0 0 20px 0;
      color: #333;
    }

    .instructions {
      background: #f9fafb;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #e5e7eb;
    }

    #block-map {
      position: relative;
      width: 100%;
      height: 50vh;
      cursor: pointer;
      margin-bottom: 40px;
    }

    /* Fullscreen overlay */
    #fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10000;
      display: none;
      opacity: 0;
      transition: opacity 300ms ease-in-out;
    }

    #fullscreen-overlay.visible {
      display: block;
    }

    #fullscreen-overlay.fade-in {
      opacity: 1;
    }

    .backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 10001;
    }

    #fullscreen-map-container {
      position: absolute;
      overflow: hidden;
      z-index: 10002;
    }

    #fullscreen-map {
      width: 100vw;
      height: 100vh;
      opacity: 0.7;
    }

    #fullscreen-map .mapboxgl-canvas-container {
      opacity: 0.7;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.95);
      border: none;
      font-size: 24px;
      cursor: pointer;
      z-index: 10003;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 300;
      transition: transform 0.2s;
    }

    .close-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Block Map -->
    <div id="block-map"></div>

    <!-- Content area -->
    <div class="content">
      <h1>Fullscreen Map Transition Test</h1>

      <div class="instructions">
        <strong>Instructions:</strong> Click anywhere on the map above to open fullscreen view.
        Watch how the markers stay in the same screen position while the map expands to reveal the surrounding area.
      </div>
    </div>
  </div>

  <!-- Fullscreen Overlay (hidden by default) -->
  <div id="fullscreen-overlay">
    <div class="backdrop"></div>
    <div id="fullscreen-map-container">
      <div id="fullscreen-map"></div>
    </div>
    <button class="close-btn">✕</button>
  </div>

  <script>
    // Mapbox token from .env
    const MAPBOX_TOKEN = 'pk.eyJ1IjoibWFkc2JlcnRlbHNlbiIsImEiOiJja2tjeDgxZWYwNHU5MnhtaTVndWRmeHpzIn0.Zs-SFtuSE9I1XAG-TG2fsw';

    // Color palette (must match between block and fullscreen maps)
    const COLORS = [
      '#3B82F6', // Blue (index 0)
      '#8B5CF6', // Purple (index 1)
      '#10B981', // Emerald (index 2)
      '#F59E0B', // Amber (index 3)
      '#EF4444', // Red (index 4)
      '#EC4899', // Pink (index 5)
      '#06B6D4', // Cyan (index 6)
      '#84CC16', // Lime (index 7)
      '#F97316', // Orange (index 8)
      '#6366F1', // Indigo (index 9)
    ];

    // Test data - 2 locations in Denmark
    const locations = [
      {
        geoId: 'loc-1',
        placeName: 'Copenhagen, Denmark',
        lat: 55.6761,
        lng: 12.5683,
        colorIndex: 0  // Blue
      },
      {
        geoId: 'loc-2',
        placeName: 'Svendborg, Denmark',
        lat: 55.0596,
        lng: 10.6067,
        colorIndex: 1  // Purple
      }
    ];

    // Set Mapbox token
    mapboxgl.accessToken = MAPBOX_TOKEN;

    // Calculate initial bounds for block map
    const lngs = locations.map(l => l.lng);
    const lats = locations.map(l => l.lat);
    const initialBlockBounds = new mapboxgl.LngLatBounds(
      [Math.min(...lngs), Math.min(...lats)],
      [Math.max(...lngs), Math.max(...lats)]
    );

    // Create block map using bounds (not center/zoom)
    const blockMap = new mapboxgl.Map({
      container: 'block-map',
      style: 'mapbox://styles/mapbox/light-v11',
      bounds: initialBlockBounds,
      fitBoundsOptions: {
        padding: 0,  // NO PADDING - simplifies alignment
        duration: 0,  // No animation
        animate: false  // Explicitly disable animation
      },
      fadeDuration: 0  // No fade animation
    });

    // Create marker element helper
    function createMarkerElement(colorIndex) {
      const bgColor = COLORS[colorIndex % COLORS.length];

      const el = document.createElement('div');
      el.style.width = '32px';
      el.style.height = '32px';
      el.style.borderRadius = '50%';
      el.style.backgroundColor = bgColor;
      el.style.border = '3px solid white';
      el.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';

      const inner = document.createElement('div');
      inner.style.width = '12px';
      inner.style.height = '12px';
      inner.style.borderRadius = '50%';
      inner.style.backgroundColor = 'white';

      el.appendChild(inner);
      return el;
    }

    // Add markers to block map
    blockMap.on('load', () => {
      locations.forEach((location) => {
        const el = createMarkerElement(location.colorIndex);

        new mapboxgl.Marker(el)
          .setLngLat([location.lng, location.lat])
          .setPopup(new mapboxgl.Popup().setText(location.placeName))
          .addTo(blockMap);
      });

      // No need to fitBounds again - already set in map constructor
      console.log('[Test] Block map loaded with bounds:', blockMap.getBounds());
    });

    // Click handler for block map
    document.getElementById('block-map').addEventListener('click', (e) => {
      // Prevent click if it's on a marker or popup
      if (e.target.closest('.mapboxgl-marker') || e.target.closest('.mapboxgl-popup')) {
        return;
      }

      openFullscreenMap();
    });

    // Fullscreen map instance
    let fullscreenMap = null;

    function openFullscreenMap() {
      // Get current bounds from block map
      const bounds = blockMap.getBounds();
      const initialBounds = {
        ne: [bounds.getNorthEast().lng, bounds.getNorthEast().lat],
        sw: [bounds.getSouthWest().lng, bounds.getSouthWest().lat]
      };

      console.log('[Test] Block map bounds:', initialBounds);
      console.log('[Test] Block map center:', blockMap.getCenter());
      console.log('[Test] Block map zoom:', blockMap.getZoom());

      // Show overlay
      const overlay = document.getElementById('fullscreen-overlay');
      overlay.classList.add('visible');

      // Trigger fade-in after DOM update
      setTimeout(() => {
        overlay.classList.add('fade-in');
      }, 10);

      // Initialize fullscreen map
      setTimeout(() => {
        initFullscreenMap(initialBounds);
      }, 100);
    }

    function initFullscreenMap(initialBounds) {
      // Remove existing map if any
      if (fullscreenMap) {
        fullscreenMap.remove();
      }

      console.log('[Test] Creating fullscreen map');

      // Get the ACTUAL bounds being displayed in the block map
      const actualBounds = blockMap.getBounds();

      console.log('[Test] Using bounds from block map:');
      console.log('  - NE:', actualBounds.getNorthEast());
      console.log('  - SW:', actualBounds.getSouthWest());

      // Create bounds object for fullscreen map
      const boundsObj = new mapboxgl.LngLatBounds(
        [actualBounds.getSouthWest().lng, actualBounds.getSouthWest().lat],
        [actualBounds.getNorthEast().lng, actualBounds.getNorthEast().lat]
      );

      // Get block map element dimensions in viewport
      const blockMapElement = document.getElementById('block-map');
      const rect = blockMapElement.getBoundingClientRect();

      // Position container to match block map rect
      const container = document.getElementById('fullscreen-map-container');
      container.style.top = `${rect.top}px`;
      container.style.left = `${rect.left}px`;
      container.style.width = `${rect.width}px`;
      container.style.height = `${rect.height}px`;

      // Calculate negative margins to extend map canvas to viewport edges
      const mapElement = document.getElementById('fullscreen-map');
      mapElement.style.marginTop = `${-rect.top}px`;
      mapElement.style.marginLeft = `${-rect.left}px`;
      mapElement.style.marginRight = `${-(window.innerWidth - rect.right)}px`;
      mapElement.style.marginBottom = `${-(window.innerHeight - rect.bottom)}px`;

      console.log('[Test] Container positioning:');
      console.log('  - Container:', { top: rect.top, left: rect.left, width: rect.width, height: rect.height });
      console.log('  - Map margins:', {
        top: -rect.top,
        left: -rect.left,
        right: -(window.innerWidth - rect.right),
        bottom: -(window.innerHeight - rect.bottom)
      });

      // Create fullscreen map with same bounds (no padding needed)
      fullscreenMap = new mapboxgl.Map({
        container: 'fullscreen-map',
        style: 'mapbox://styles/mapbox/light-v11',
        bounds: boundsObj,
        interactive: true,
        trackResize: true,
        fadeDuration: 0
      });

      // Add markers
      locations.forEach((location) => {
        const el = createMarkerElement(location.colorIndex);

        new mapboxgl.Marker(el)
          .setLngLat([location.lng, location.lat])
          .setPopup(new mapboxgl.Popup().setText(location.placeName))
          .addTo(fullscreenMap);
      });

      // On map load: already at correct bounds from constructor
      fullscreenMap.on('load', () => {
        console.log('[Test] Fullscreen map loaded');
        console.log('[Test] Fullscreen map bounds:', fullscreenMap.getBounds());
        console.log('[Test] Fullscreen map zoom:', fullscreenMap.getZoom());

        // Step 2: Wait 300ms, then expand to show all locations
        setTimeout(() => {
          const lngs = locations.map(l => l.lng);
          const lats = locations.map(l => l.lat);

          const expandedBounds = new mapboxgl.LngLatBounds(
            [Math.min(...lngs), Math.min(...lats)],
            [Math.max(...lngs), Math.max(...lats)]
          );

          /*
          fullscreenMap.fitBounds(expandedBounds, {
            padding: 80,
            maxZoom: 15,
            duration: 800  // Smooth animation
          });
          */

          console.log('[Test] Expanding to full bounds');
        }, 300);
      });
    }

    // Close button handler
    document.querySelector('.close-btn').addEventListener('click', () => {
      const overlay = document.getElementById('fullscreen-overlay');
      overlay.classList.remove('fade-in');

      setTimeout(() => {
        overlay.classList.remove('visible');
        if (fullscreenMap) {
          fullscreenMap.remove();
          fullscreenMap = null;
        }
      }, 300);
    });
  </script>
</body>
</html>
