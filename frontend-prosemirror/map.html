<!doctype html>
<html>
  <head>
    <title>Map View</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #1f2937;
        background-color: #ffffff;
      }

      /* Map header */
      #map-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        z-index: 1000;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      }

      #map-title {
        font-size: 16px;
        font-weight: 600;
        color: #1f2937;
      }

      #close-btn {
        padding: 8px 16px;
        background-color: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      #close-btn:hover {
        background-color: #2563eb;
      }

      #close-btn:active {
        background-color: #1d4ed8;
      }

      /* Map container */
      #map {
        position: absolute;
        top: 49px; /* Header height */
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* Custom marker styling */
      .map-marker {
        cursor: pointer;
        transition: transform 0.2s;
      }

      .map-marker:hover {
        transform: scale(1.1);
      }

      /* Location popup styling */
      .mapboxgl-popup-content {
        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .popup-title {
        font-weight: 600;
        margin-bottom: 4px;
        color: #1f2937;
      }

      .popup-coords {
        font-size: 12px;
        color: #6b7280;
        font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      }

      /* Loading state */
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 999;
      }

      #loading.hidden {
        display: none;
      }

      .spinner {
        border: 3px solid #f3f4f6;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 12px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-text {
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="map-header">
      <h1 id="map-title">Map View</h1>
      <button id="close-btn">Close</button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading map...</div>
    </div>

    <div id="map"></div>

    <script src="/src/map/index.js" type="module"></script>
  </body>
</html>
