<!DOCTYPE html>
<html>
<head>
  <title>TURN Relay Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .candidate { padding: 5px; margin: 5px 0; border-left: 3px solid #ccc; }
    .host { border-color: #4CAF50; }
    .srflx { border-color: #2196F3; }
    .relay { border-color: #FF9800; font-weight: bold; }
  </style>
</head>
<body>
  <h1>TURN Relay Candidate Test</h1>
  <p>Testing if browser generates relay candidates with current TURN configuration...</p>

  <div>
    <button id="test-all">Test with iceTransportPolicy: 'all'</button>
    <button id="test-relay">Test with iceTransportPolicy: 'relay'</button>
  </div>

  <h2>Results:</h2>
  <div id="results"></div>

  <h2>Candidates:</h2>
  <div id="candidates"></div>

  <script>
    const resultsDiv = document.getElementById('results');
    const candidatesDiv = document.getElementById('candidates');

    function clearResults() {
      resultsDiv.innerHTML = '';
      candidatesDiv.innerHTML = '';
    }

    function log(message, type = 'info') {
      const p = document.createElement('p');
      p.textContent = message;
      p.style.color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
      resultsDiv.appendChild(p);
      console.log(message);
    }

    function testTURN(iceTransportPolicy) {
      clearResults();
      log(`Testing with iceTransportPolicy: '${iceTransportPolicy}'`);

      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          // Local coturn TURN server (use local network IP, not localhost)
          {
            urls: 'turn:192.168.1.223:3478',
            username: 'testuser',
            credential: 'testpass',
          },
        ],
        iceCandidatePoolSize: 10,
        iceTransportPolicy: iceTransportPolicy,
      };

      log('Creating RTCPeerConnection...');
      const pc = new RTCPeerConnection(config);

      const candidateTypes = { host: 0, srflx: 0, relay: 0 };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          const candidate = event.candidate.candidate;
          console.log('Candidate:', candidate);

          // Parse candidate type
          const typeMatch = candidate.match(/typ (\w+)/);
          if (typeMatch) {
            const type = typeMatch[1];
            candidateTypes[type] = (candidateTypes[type] || 0) + 1;

            const div = document.createElement('div');
            div.className = `candidate ${type}`;
            div.textContent = candidate;
            candidatesDiv.appendChild(div);
          }
        } else {
          log('ICE gathering complete!');
          log(`Host candidates: ${candidateTypes.host}`);
          log(`Server reflexive (srflx) candidates: ${candidateTypes.srflx}`);
          log(`Relay candidates: ${candidateTypes.relay}`, candidateTypes.relay > 0 ? 'success' : 'error');

          if (candidateTypes.relay === 0) {
            log('⚠️ NO RELAY CANDIDATES GENERATED - This is the problem!', 'error');
          } else {
            log('✓ Relay candidates were generated successfully', 'success');
          }
        }
      };

      pc.onicegatheringstatechange = () => {
        log(`ICE gathering state: ${pc.iceGatheringState}`);
      };

      // Create a data channel to trigger ICE gathering
      log('Creating data channel to trigger ICE gathering...');
      pc.createDataChannel('test');

      // Create offer to start ICE gathering
      log('Creating offer...');
      pc.createOffer()
        .then(offer => {
          log('Offer created, setting local description...');
          return pc.setLocalDescription(offer);
        })
        .then(() => {
          log('Local description set. Waiting for ICE candidates...');
        })
        .catch(err => {
          log(`Error: ${err.message}`, 'error');
        });
    }

    document.getElementById('test-all').addEventListener('click', () => {
      testTURN('all');
    });

    document.getElementById('test-relay').addEventListener('click', () => {
      testTURN('relay');
    });

    // Auto-run test with 'all' on load
    window.addEventListener('load', () => {
      log('Page loaded. Click a button to test TURN configuration.');
    });
  </script>
</body>
</html>
